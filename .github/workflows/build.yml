name: Build Project Releases

on:
  push:
    branches: [main]
    paths:
      - "projects/**"
      - "scripts/**"
      - "index.html"
      - "config.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC

permissions:
  contents: write
  actions: write # per-project site snapshots via upload-artifact

concurrency:
  group: releases-gh-pages
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pids.outputs.matrix }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          path: main
          fetch-depth: 1

      - name: List projects
        id: pids
        run: python3 main/scripts/ci.py matrix --root main --output "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pid: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          path: main
          fetch-depth: 1

      - name: Sparse site checkout (own project files only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 main/scripts/ci.py checkout --site-dir site --sparse ${{ matrix.pid }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: "false"

      - name: Restore dependency caches
        uses: actions/cache@v6
        with:
          path: |
            main/.cache/m2
            main/.cache/gradle
            main/.cache/npm
          key: deps-${{ runner.os }}-${{ hashFiles('main/projects/*.json') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Run build script
        working-directory: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run scripts/build.py --site-dir $GITHUB_WORKSPACE/site --only ${{ matrix.pid }}

      - name: Upload site snapshot
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.pid }}
          path: site
          retention-days: 1

  publish:
    needs: [plan, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          path: main
          fetch-depth: 1

      - name: Bootstrap site checkout (gh-pages branch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 main/scripts/ci.py checkout --site-dir site

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: "false"

      - name: Download site snapshots
        uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: incoming

      - name: Overlay per-project outputs
        run: python3 main/scripts/ci.py overlay --site-dir site --incoming incoming --matrix '${{ needs.plan.outputs.matrix }}'

      - name: Commit and push site deltas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          MSG=$(python3 main/scripts/ci.py message --site-dir site --matrix "$MATRIX")
          python3 main/scripts/ci.py push --site-dir site --message "$MSG"
